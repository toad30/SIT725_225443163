<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIT725 Task 3.3P</title>

    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="light-green lighten-2">
    <nav class="light-green">
        <div class="nav-wrapper navbar-size">
            <a href="#" class="brand-logo">
                <img src="assets/frog.png" alt="Frog logo" class="user-image-size" />
            </a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a target="_blank" href="https://en.wikipedia.org/wiki/Frog">About</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-body">
        <div class="container">
            <div class="row">
                <div class="col s12 center-align">
                    <h1 class="heading">SIT725 Task 3.3P</h1>
                    <p class="flow-text">This webpage shows cards with information about frogs.</p>
                </div>
            </div>

            <div class="row">
                <div class="col s12 center-align">
                    <img class="featured-frog" src="assets/turtle frog.jpg" />
                    <p class="flow-text">
                        Frog of the day: <a href="https://en.wikipedia.org/wiki/Myobatrachus" style="text-decoration: underline;">Turtle Frog</a>
                    </p>
                </div>
            </div>

            <div class="row valign-wrapper">
                <div class="col s12 l6 left-align">
                    <p class="flow-text">Previous Frogs of the Day</p>
                </div>
                <div class="col s12 l6 right-align">
                    <a class="waves-effect waves-light btn" id="random-frog-btn">Newsletter</a>
                </div>
            </div>

            <div class="row">
                <div class="col s12 m6 l3">
                    <div class="card">
                        <div class="card-image">
                            <img src="assets/glass frog.jpg" alt="Glass Frog">
                            <span class="card-title">Glass Frog</span>
                        </div>
                        <div class="card-action light-green darken-3">
                            <a href="https://en.wikipedia.org/wiki/Glass_frog" target="_blank">
                                Learn More
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col s12 m6 l3">
                    <div class="card">
                        <div class="card-image">
                            <img src="assets/hairy frog.jpg" alt="Hairy Frog">
                            <span class="card-title">Hairy Frog</span>
                        </div>
                        <div class="card-action light-green darken-3">
                            <a href="https://en.wikipedia.org/wiki/Hairy_frog" target="_blank">
                                Learn More
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col s12 m6 l3">
                    <div class="card">
                        <div class="card-image">
                            <img src="assets/balloon frog.jpg" alt="Balloon Frog">
                            <span class="card-title">Balloon Frog</span>
                        </div>
                        <div class="card-action light-green darken-3">
                            <a href="https://en.wikipedia.org/wiki/Glyphoglossus_molossus" target="_blank">
                                Learn More
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col s12 m6 l3">
                    <div class="card">
                        <div class="card-image">
                            <img src="assets/budgetts frog.jpg" alt="Budgett's Frog">
                            <span class="card-title">Budgett's Frog</span>
                        </div>
                        <div class="card-action light-green darken-3">
                            <a href="https://en.wikipedia.org/wiki/Lepidobatrachus_laevis" target="_blank">
                                Learn More
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
