<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator API</title>
</head>

<body>
    <h1>Welcome to the Simple Calculator API</h1>
    <p>The following endpoints are available:</p>
    <h3>Add</h3>
    <p>e.g. /add?a=5&b=3</p>
    <h3>Subtract</h3>
    <p>e.g. /subtract?a=5&b=3</p>
    <h3>Multiply</h3>
    <p>e.g. /multiply?a=5&b=3</p>
    <h3>Divide</h3>
    <p>e.g. /divide?a=5&b=3</p>
</body>
</html>
